[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-tts-engineering-pipeline"
version = "0.1.0"
description = "Offline reference implementation of a production-shaped Arabic dictionary TTS pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arabic-tts = "arabic_tts_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

